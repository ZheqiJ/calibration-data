# Public metadata runner enabled; touching this workflow triggers a fresh output build on main.
name: Build UKB DMCA Outputs

on:
  workflow_dispatch:
    inputs:
      applications_url:
        description: Optional URL for the UKB approved applications TSV.
        required: false
        type: string
      scan_all_markdown:
        description: Scan every github/dmca Markdown file body instead of relying on tree plus code search.
        required: false
        default: false
        type: boolean
      wayback_limit:
        description: Internet Archive CDX captures per repository. Use 0 to disable.
        required: false
        default: "0"
        type: string
      schema19_url:
        description: Optional URL for UKB Schema 19 publication metadata CSV/TSV.
        required: false
        type: string
      schema24_url:
        description: Optional URL for UKB Schema 24 publication-application mapping CSV/TSV.
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - .github/workflows/ukb-dmca-pipeline.yml
      - scripts/**
      - tests/**
      - data/applications.tsv
      - data/application.tsv
      - data/application*.txt
      - data/schema19*
      - data/schema_19*
      - data/schema24*
      - data/schema_24*
      - data/public_metadata_seeds.*

permissions:
  contents: write

concurrency:
  group: ukb-dmca-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare application input
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          valid_app_file() {
            python3 - "$1" <<'PY'
          import re
          import sys
          from pathlib import Path
          p = Path(sys.argv[1])
          if not p.exists():
              raise SystemExit(1)
          text = p.read_text(encoding="utf-8-sig", errors="replace")
          lines = [line for line in text.splitlines() if line.strip()]
          if not lines or "app_id" not in lines[0].lower():
              raise SystemExit(1)
          if not re.search(r"(?m)^\d+\t", text):
              raise SystemExit(1)
          PY
          }
          APP_INPUT=""
          for candidate in data/applications.tsv data/application.tsv data/application*.txt; do
            if [ -e "${candidate}" ] && valid_app_file "${candidate}"; then
              APP_INPUT="${candidate}"
              break
            fi
          done
          if [ -n "${APP_INPUT}" ]; then
            echo "Using ${APP_INPUT}"
            if [ "${APP_INPUT}" != "data/applications.tsv" ]; then
              cp "${APP_INPUT}" data/applications.tsv
            fi
          elif [ -n "${{ inputs.applications_url }}" ]; then
            curl -L --fail --retry 3 --retry-delay 10 "${{ inputs.applications_url }}" -o data/applications.tsv
            valid_app_file data/applications.tsv || {
              echo "Downloaded applications_url but it is not a valid UKB applications TSV." >&2
              exit 1
            }
          else
            echo "Missing valid application input. Add data/applications.tsv, data/application.tsv, or data/application*.txt with app_id/title/pi/institution/notes rows, or provide workflow_dispatch applications_url." >&2
            exit 1
          fi

      - name: Run tests
        run: python3 -m unittest discover -s tests

      - name: Prepare optional publication schemas
        shell: bash
        run: |
          set -euo pipefail
          SCHEMA19=""
          SCHEMA24=""
          for candidate in data/schema19.tsv data/schema19.csv data/schema_19.tsv data/schema_19.csv data/schema19* data/schema_19*; do
            if [ -f "${candidate}" ]; then
              SCHEMA19="${candidate}"
              break
            fi
          done
          for candidate in data/schema24.tsv data/schema24.csv data/schema_24.tsv data/schema_24.csv data/schema24* data/schema_24*; do
            if [ -f "${candidate}" ]; then
              SCHEMA24="${candidate}"
              break
            fi
          done
          if [ -z "${SCHEMA19}" ] && [ -n "${{ inputs.schema19_url }}" ]; then
            curl -L --fail --retry 3 --retry-delay 10 "${{ inputs.schema19_url }}" -o data/schema19.tsv
            SCHEMA19="data/schema19.tsv"
          fi
          if [ -z "${SCHEMA24}" ] && [ -n "${{ inputs.schema24_url }}" ]; then
            curl -L --fail --retry 3 --retry-delay 10 "${{ inputs.schema24_url }}" -o data/schema24.tsv
            SCHEMA24="data/schema24.tsv"
          fi
          echo "SCHEMA19=${SCHEMA19}" >> "${GITHUB_ENV}"
          echo "SCHEMA24=${SCHEMA24}" >> "${GITHUB_ENV}"

      - name: Build outputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SCAN_ARGS=()
          SCHEMA_ARGS=()
          FIXED_NOTICE_ARGS=()
          SCAN_ALL_MARKDOWN="${{ inputs.scan_all_markdown || 'false' }}"
          WAYBACK_LIMIT="${{ inputs.wayback_limit || '0' }}"
          if [ "${SCAN_ALL_MARKDOWN}" = "true" ]; then
            SCAN_ARGS+=(--scan-all-markdown)
          fi
          if [ -n "${SCHEMA19:-}" ] && [ -n "${SCHEMA24:-}" ]; then
            SCHEMA_ARGS+=(--schema19 "${SCHEMA19}" --schema24 "${SCHEMA24}")
          fi
          if [ -f ukb_dmca_notices.csv ]; then
            FIXED_NOTICE_ARGS+=(--fixed-notices-csv ukb_dmca_notices.csv)
          fi
          python3 scripts/ukb_dmca_public_metadata_runner.py \
            --applications data/applications.tsv \
            --output-dir . \
            --cache-dir .cache/ukb_dmca \
            --wayback-limit "${WAYBACK_LIMIT}" \
            "${SCHEMA_ARGS[@]}" \
            "${FIXED_NOTICE_ARGS[@]}" \
            "${SCAN_ARGS[@]}"

      - name: Commit generated outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md ukb_dmca_*.csv evidence/
          git commit -m "Generate UKB DMCA matching outputs" || exit 0
          git push origin HEAD:main
